name: Idea or suggestion / Idea o sugerencia
description: Propose something new or an improvement. / Propón algo nuevo o una mejora.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea / Tu idea
      description: What would you like the widget to do? / ¿Qué te gustaría que hiciera el widget?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why? / ¿Para qué?
      description: How would it improve your experience? / ¿Cómo mejoraría tu experiencia?
    validations:
      required: false
